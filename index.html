<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamfolio 🎀</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pink-soft: #ffdde1;
            --accent: #ff85a1;
            --shadow: rgba(255, 133, 161, 0.15);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--pink-soft); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; border: 2px solid var(--pink-soft); }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--pink-soft); 
            background-image: radial-gradient(#fff 2px, transparent 2px); 
            background-size: 30px 30px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            position: fixed;
            top: -80px;
            left: 0; width: 100%; height: 70px;
            background: white;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; box-shadow: 0 4px 15px var(--shadow);
            z-index: 2000;
            transition: top 0.4s ease;
        }
        .navbar.visible { top: 0; }

        .nav-logo {
            font-family: 'Cherry Bomb One', cursive;
            font-size: 1.6rem; color: var(--accent); font-weight: 400; cursor: pointer;
        }
        .nav-links { display: flex; gap: 15px; }
        .nav-item { font-weight: 600; color: #888; cursor: pointer; font-size: 0.85rem; }

        #home-page { 
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        .home-title {
            font-family: 'Cherry Bomb One', cursive;
            font-size: clamp(3.5rem, 15vw, 5.5rem);
            color: white;
            text-shadow: 5px 5px 0px var(--accent);
            margin-bottom: 40px;
            font-weight: 400;
        }

        .home-subtitle {
            margin-top: 40px;
            font-family: 'Dancing Script', cursive;
            font-weight: 800;
            color: white;
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px var(--accent);
            animation: fadeIn 1.2s ease;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        .icon-card { 
            background: white; border-radius: 40px; padding: 40px 20px; 
            cursor: pointer; border: 8px solid white; 
            box-shadow: 0 15px 30px var(--shadow); transition: var(--transition); 
        }
        .icon-card:hover { transform: scale(1.05) rotate(2deg); }
        .icon-emoji { font-size: 3.5rem; display: block; margin-bottom: 10px; }
        .icon-label { font-size: 1.3rem; color: var(--accent); font-family: 'Cherry Bomb One', cursive; font-weight: 400; }

        .container { max-width: 1200px; margin: 0 auto; padding: 90px 15px 20px 15px; display: none; }
        .container.active { display: block; }

        .sticky-filters {
            position: sticky;
            top: 70px;
            background: var(--pink-soft);
            padding: 10px 0;
            z-index: 1000;
            margin-bottom: 15px;
        }

        .filters { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .filter-btn { 
            background: white; border: none; padding: 10px 18px; 
            border-radius: 50px; cursor: pointer; color: var(--accent); 
            font-weight: 400; box-shadow: 0 4px 8px var(--shadow);
            font-size: 0.9rem;
        }
        .filter-btn.active { background: var(--accent); color: white; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }
        
        .item-card { 
            background: white; border-radius: 20px; padding: 10px; 
            border: 3px solid white; box-shadow: 0 6px 12px var(--shadow); text-align: center;
        }

        .img-container { 
            width: 100%; aspect-ratio: 2/3; border-radius: 12px; 
            overflow: hidden; margin-bottom: 8px; background: #fff0f3; 
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .item-title { font-weight: 600; color: #444; font-size: 0.85rem; line-height: 1.2; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<!-- THE AUDIO ELEMENT -->
<audio id="pop-sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>

<nav class="navbar" id="main-nav">
    <div class="nav-logo" onclick="showHome()">Dreamfolio</div>
    <div class="nav-links">
        <div class="nav-item" onclick="openSection('watch')">Watch</div>
        <div class="nav-item" onclick="openSection('diy')">DIY</div>
    </div>
</nav>

<main id="home-page">
    <h1 class="home-title">Dreamfolio</h1>
    <div class="icon-grid">
        <div class="icon-card" onclick="openSection('watch')">
            <span class="icon-emoji">🍿</span>
            <span class="icon-label">Watchlist</span>
        </div>
        <div class="icon-card" onclick="openSection('diy')">
            <span class="icon-emoji">🎀</span>
            <span class="icon-label">DIY Ideas</span>
        </div>
    </div>
    <p class="home-subtitle">Aqsa's Pocket Pinterest</p>
</main>

<div class="container" id="section-container">
    <section id="dynamic-content">
        <div class="sticky-filters">
            <div id="filter-container" class="filters"></div>
        </div>
        <div class="grid" id="content-grid"></div>
    </section>
</div>

<script>
    const TMDB_KEY = 'e3c3686e5a9306f584a69824326db981';
    const SHEET_ID = '1f_PUv6_kAfHFaCMuEcki4tQwRYwmFLjqr-UQk_Ov9FA';
    let diyData = []; 

    // SOUND FUNCTION
    function playPop() {
        const sound = document.getElementById('pop-sound');
        sound.currentTime = 0;
        sound.volume = 0.4;
        sound.play().catch(e => console.log("User must interact first"));
    }

    window.onpopstate = function() { showHome(false); };

    function openSection(id) {
        playPop(); // Play sound on menu click
        history.pushState({page: id}, id, "");
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('main-nav').classList.add('visible');
        document.getElementById('section-container').classList.add('active');
        
        if(id === 'watch') setupWatchlist();
        if(id === 'diy') setupDIY();
        window.scrollTo(0,0);
    }

    function showHome(updateHistory = true) {
        playPop(); // Play sound on logo click
        document.getElementById('home-page').style.display = 'flex';
        document.getElementById('main-nav').classList.remove('visible');
        document.getElementById('section-container').classList.remove('active');
        if(updateHistory) history.replaceState(null, "", " ");
        window.scrollTo(0,0);
    }

    async function setupDIY() {
        const filterContainer = document.getElementById('filter-container');
        const grid = document.getElementById('content-grid');
        grid.innerHTML = '<center>🎀 Loading...</center>';
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;
        try {
            const res = await fetch(url);
            const text = await res.text();
            const json = JSON.parse(text.substr(47).slice(0, -2));
            diyData = json.table.rows.slice(1).map(r => ({
                title: r.c[0]?.v || "Untitled",
                category: r.c[1]?.v || "Other",
                img: r.c[2]?.v || ""
            }));
            const categories = [...new Set(diyData.map(item => item.category))];
            filterContainer.innerHTML = `<button class="filter-btn active" onclick="playPop(); filterDIY('All', this)">All</button>` + 
                categories.map((cat) => `<button class="filter-btn" onclick="playPop(); filterDIY('${cat}', this)">${cat}</button>`).join('');
            filterDIY('All', filterContainer.querySelector('.filter-btn'));
        } catch (e) { grid.innerHTML = "<center>Check Sheet 🎀</center>"; }
    }

    function filterDIY(category, btn) {
        updateFilterUI(btn);
        const grid = document.getElementById('content-grid');
        const filtered = category === 'All' ? diyData : diyData.filter(item => item.category === category);
        grid.innerHTML = filtered.map(item => `
            <div class="item-card" onclick="playPop()">
                <div class="img-container"><img src="${item.img}" loading="lazy"></div>
                <div class="item-title">${item.title}</div>
            </div>
        `).join('');
    }

    function setupWatchlist() {
        const filterContainer = document.getElementById('filter-container');
        const genres = [
            { name: 'All', id: 'popular' },
            { name: 'Rom-Com', id: '10749' },
            { name: 'Thriller', id: '53' },
            { name: 'Horror', id: '27' },
            { name: 'K-Drama', id: 'kdrama' }
        ];
        filterContainer.innerHTML = genres.map((g, index) => `
            <button class="filter-btn ${index === 0 ? 'active' : ''}" onclick="playPop(); loadMovies('${g.id}', this)">${g.name}</button>
        `).join('');
        loadMovies('popular', filterContainer.querySelector('.filter-btn'));
    }

    async function loadMovies(type, btn) {
        updateFilterUI(btn);
        const grid = document.getElementById('content-grid');
        grid.innerHTML = '<center>✨ Loading...</center>';
        let url = type === 'kdrama' 
            ? `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_origin_country=KR&sort_by=popularity.desc`
            : type === 'popular' 
            ? `https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_KEY}`
            : `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_genres=${type}`;
        const res = await fetch(url);
        const data = await res.json();
        grid.innerHTML = data.results.map(m => `
            <div class="item-card" onclick="playPop()">
                <div class="img-container">
                    <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" loading="lazy">
                </div>
                <div class="item-title">${m.title || m.name}</div>
            </div>
        `).join('');
    }

    function updateFilterUI(btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
</script>
</body>
</html>
