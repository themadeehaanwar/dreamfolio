<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamfolio 🎀</title>
    
    <!-- The Browser Tab Icon -->
    <link rel="icon" href="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Ribbon.png?v=2" type="image/png">
    
    <!-- The Home Screen Icon -->
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Ribbon.png?v=2">
    
    <!-- Essential App Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Dreamfolio">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pink-soft: #ffdde1;
            --accent: #ff85a1;
            --shadow: rgba(255, 133, 161, 0.15);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--pink-soft); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; border: 2px solid var(--pink-soft); }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--pink-soft); 
            background-image: radial-gradient(#fff 2px, transparent 2px); 
            background-size: 30px 30px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        .navbar {
            position: fixed;
            top: -80px;
            left: 0; width: 100%; height: 70px;
            background: white;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; box-shadow: 0 4px 15px var(--shadow);
            z-index: 2000;
            transition: top 0.4s ease;
        }
        .navbar.visible { top: 0; }

        .nav-logo {
            font-family: 'Cherry Bomb One', cursive;
            font-size: 1.6rem; color: var(--accent); font-weight: 400; cursor: pointer;
        }
        .nav-links { display: flex; gap: 15px; }
        .nav-item { font-weight: 600; color: #888; cursor: pointer; font-size: 0.85rem; }

        /* --- HOME PAGE --- */
        #home-page { 
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        .home-title {
            font-family: 'Cherry Bomb One', cursive;
            font-size: clamp(3.5rem, 15vw, 5.5rem);
            color: white;
            text-shadow: 5px 5px 0px var(--accent);
            margin-bottom: 40px;
            font-weight: 400;
        }

        .home-subtitle {
            margin-top: 40px;
            font-family: 'Dancing Script', cursive;
            font-weight: 800;
            color: white;
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px var(--accent);
            animation: fadeIn 1.2s ease;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        .icon-card { 
            background: white; border-radius: 40px; padding: 40px 20px; 
            cursor: pointer; border: 8px solid white; 
            box-shadow: 0 15px 30px var(--shadow); transition: var(--transition); 
        }
        .icon-card:hover { transform: scale(1.05) rotate(2deg); }
        .icon-emoji { font-size: 3.5rem; display: block; margin-bottom: 10px; }
        .icon-label { font-size: 1.3rem; color: var(--accent); font-family: 'Cherry Bomb One', cursive; font-weight: 400; }

        /* --- CONTENT CONTAINERS --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 90px 15px 20px 15px; display: none; }
        .container.active { display: block; }

        .sticky-filters {
            position: sticky;
            top: 70px;
            background: var(--pink-soft);
            padding: 10px 0;
            z-index: 1000;
            margin-bottom: 15px;
        }

        .filters { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .filter-btn { 
            background: white; border: none; padding: 10px 18px; 
            border-radius: 50px; cursor: pointer; color: var(--accent); 
            font-weight: 400; box-shadow: 0 4px 8px var(--shadow);
            font-size: 0.9rem;
        }
        .filter-btn.active { background: var(--accent); color: white; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }
        
        .item-card { 
            background: white; border-radius: 20px; padding: 10px; 
            border: 3px solid white; box-shadow: 0 6px 12px var(--shadow); text-align: center;
            position: relative;
        }

        .img-container { 
            width: 100%; aspect-ratio: 2/3; border-radius: 12px; 
            overflow: hidden; margin-bottom: 8px; background: #fff0f3; 
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .item-title { font-weight: 600; color: #444; font-size: 0.85rem; line-height: 1.2; }

        /* --- MUSIC PLAYER STYLES --- */
        .music-controls {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 10px 15px;
            border-radius: 50px;
            box-shadow: 0 10px 25px var(--shadow);
            z-index: 9999;
            border: 3px solid white;
        }
        .music-btn {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--accent);
            transition: var(--transition);
        }
        .music-btn:hover { transform: scale(1.2); }
        .main-play { font-size: 1.8rem; }

        /* --- HEART BUTTON --- */
        .heart-btn {
            position: absolute; top: 15px; right: 15px;
            background: white; border: none; width: 30px; height: 30px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 1rem; transition: var(--transition); z-index: 10;
        }
        .heart-btn.active { color: #ff4d6d; transform: scale(1.2); }
        .heart-btn:not(.active) { color: #ccc; }

        /* --- CHARACTER PEEKER STYLES --- */
        .character-peeker {
            position: fixed; z-index: 10000; width: 100px;
            pointer-events: auto; display: none; cursor: pointer;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2)); user-select: none;
        }
        .character-peeker img { width: 100%; height: auto; display: block; }

        .heart-particle {
            position: fixed; z-index: 10001; pointer-events: none;
            font-size: 2rem; color: var(--accent); 
            text-shadow: 0 0 8px rgba(255, 133, 161, 0.6);
            animation: heartFloat 1.5s ease-out forwards;
        }

        @keyframes heartFloat {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.8) rotate(35deg); opacity: 0; }
        }

        @keyframes peek-bottom { 0% { transform: translateY(120px); } 15%, 85% { transform: translateY(15px); } 100% { transform: translateY(120px); } }
        @keyframes peek-top { 0% { transform: translateY(-120px) rotate(180deg); } 15%, 85% { transform: translateY(-15px) rotate(180deg); } 100% { transform: translateY(-120px) rotate(180deg); } }
        @keyframes peek-left { 0% { transform: translateX(-120px) rotate(90deg); } 15%, 85% { transform: translateX(-15px) rotate(90deg); } 100% { transform: translateX(-120px) rotate(90deg); } }
        @keyframes peek-right { 0% { transform: translateX(120px) rotate(-90deg); } 15%, 85% { transform: translateX(15px) rotate(-90deg); } 100% { transform: translateX(120px) rotate(-90deg); } }

        /* --- THE FLOATING ENVELOPE --- */
        .floating-envelope {
            position: fixed; bottom: 30px; right: 30px;
            font-size: 2.8rem; cursor: pointer; z-index: 9999;
            transition: var(--transition); filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
            animation: floatAnim 3s ease-in-out infinite;
        }
        @keyframes floatAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .floating-envelope:hover { transform: scale(1.2) rotate(10deg); filter: drop-shadow(0 8px 15px var(--accent)); }

        /* --- NOTE OVERLAY --- */
        .note-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.25); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 20000;
        }
        .note-card {
            background: white; padding: 35px; border-radius: 4px;
            width: 85%; max-width: 320px; text-align: center;
            box-shadow: 12px 12px 0px var(--accent); border: 1px solid #eee;
            animation: fadeIn 0.3s ease;
        }
        .card-header { color: var(--accent); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; font-size: 0.85rem; margin-bottom: 25px; }
        .note-card p { color: #444; font-size: 1.1rem; line-height: 1.6; margin-bottom: 15px; font-family: 'Georgia', serif; font-style: italic; }
        #score-display { font-size: 0.75rem; color: #ccc; text-transform: uppercase; margin-bottom: 20px; font-weight: 600; letter-spacing: 1px; }
        .close-btn { background: #333; border: none; padding: 10px 22px; color: white; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .close-btn:hover { background: var(--accent); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<nav class="navbar" id="main-nav">
    <div class="nav-logo" onclick="showHome()">Dreamfolio</div>
    <div class="nav-links">
        <div class="nav-item" onclick="openSection('watch')">Watch</div>
        <div class="nav-item" onclick="openSection('diy')">DIY</div>
    </div>
</nav>

<main id="home-page">
    <h1 class="home-title">Dreamfolio</h1>
    <div class="icon-grid">
        <div class="icon-card" onclick="openSection('watch')">
            <span class="icon-emoji">🍿</span>
            <span class="icon-label">Watchlist</span>
        </div>
        <div class="icon-card" onclick="openSection('diy')">
            <span class="icon-emoji">🎀</span>
            <span class="icon-label">DIY Ideas</span>
        </div>
    </div>
    <p class="home-subtitle">Aqsa's Pocket Pinterest</p>
</main>

<div class="container" id="section-container">
    <section id="dynamic-content">
        <div class="sticky-filters">
            <div id="filter-container" class="filters"></div>
        </div>
        <div class="grid" id="content-grid"></div>
    </section>
</div>

<!-- Music Player UI -->
<div class="music-controls">
    <button class="music-btn" onclick="prevSong()">⏮</button>
    <button id="play-btn" class="music-btn main-play" onclick="toggleMusic()">▶</button>
    <button class="music-btn" onclick="nextSong()">⏭</button>
    <audio id="bg-music" onended="nextSong()"></audio>
</div>

<div id="peeker" class="character-peeker" onclick="catchTeddy(event)">
    <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Animals/Bear.png" alt="teddy">
</div>

<div id="note-icon" class="floating-envelope" onclick="openNote()">
    <span>✉️</span>
</div>

<div id="note-overlay" class="note-overlay" onclick="closeNote()">
    <div class="note-card" onclick="event.stopPropagation()">
        <div class="card-header">Pookie Reminder</div>
        <p id="note-content"></p>
        <div id="score-display"></div>
        <button class="close-btn" onclick="closeNote()">Thanks!</button>
    </div>
</div>

<script>
    const TMDB_KEY = 'e3c3686e5a9306f584a69824326db981';
    const SHEET_ID = '1f_PUv6_kAfHFaCMuEcki4tQwRYwmFLjqr-UQk_Ov9FA';
    let diyData = []; 
    let currentMovies = [];
    let favourites = JSON.parse(localStorage.getItem('dreamfolio_favs')) || { diy: [], watch: [] };
    let currentMode = '';

    /* --- MUSIC PLAYER LOGIC --- */
    const audio = document.getElementById('bg-music');
    const playBtn = document.getElementById('play-btn');
    const playlist = [
        { url: "https://github.com/themadeehaanwar/dreamfolio/raw/refs/heads/main/Strawberries%20&%20Cigarettes%20-%20Troye%20Sivan.mp3" },
        { url: "https://github.com/themadeehaanwar/dreamfolio/raw/refs/heads/main/NIKI%20-%20lowkey%20(Official%20Visualizer)%20-%2088rising.mp3" },
        { url: "https://github.com/themadeehaanwar/dreamfolio/raw/refs/heads/main/Kali%20Uchis%20-%20All%20I%20Can%20Say%20-%20KaliUchisVEVO.mp3" },
        { url: "https://github.com/themadeehaanwar/dreamfolio/raw/refs/heads/main/Dhruv%20-%20double%20take%20(Official%20Audio)%20-%20Dhruv.mp3" },
        { url: "https://github.com/themadeehaanwar/dreamfolio/raw/refs/heads/main/sombr%20-%20back%20to%20friends%20(official%20audio)%20-%20sombr.mp3" },
        { url: "https://github.com/themadeehaanwar/dreamfolio/raw/refs/heads/main/yung%20kai%20-%20wildflower%20(official%20lyric%20video)%20-%20yung%20kai.mp3" },
        { url: "https://github.com/themadeehaanwar/dreamfolio/raw/refs/heads/main/Lana%20Del%20Rey%20-%20Chemtrails%20Over%20The%20Country%20Club%20(Official%20Music%20Video)%20-%20LanaDelReyVEVO.mp3" },
        { url: "https://github.com/themadeehaanwar/dreamfolio/raw/refs/heads/main/Diet%20Mountain%20Dew%20-%20Lana%20Del%20Rey.mp3" },
        { url: "https://github.com/themadeehaanwar/dreamfolio/raw/refs/heads/main/mxmtoon%20~%20prom%20dress%20(lyrics)%20-%20a%20paradise%20bird.mp3" },
        { url: "https://github.com/themadeehaanwar/dreamfolio/raw/refs/heads/main/Wheatus%20-%20Teenage%20Dirtbag%20(Official%20Video)%20-%20WheatusVEVO.mp3" },
        { url: "https://github.com/themadeehaanwar/dreamfolio/raw/refs/heads/main/HONNE%20-%20la%20la%20la%20that's%20how%20it%20goes%20(Official%20Lyric%20Video)%20-%20H%20O%20N%20N%20E.mp3" },
        { url: "https://github.com/themadeehaanwar/dreamfolio/raw/refs/heads/main/The%201975%20-%20About%20You%20(Official)%20-%20The1975VEVO.mp3" },
        ];
    let songIdx = 0;

    function toggleMusic() {
        if (!audio.src) audio.src = playlist[songIdx].url;
        if (audio.paused) { 
            audio.play().catch(e => console.log("User must interact first")); 
            playBtn.innerText = "⏸"; 
        } 
        else { audio.pause(); playBtn.innerText = "▶"; }
    }
    function nextSong() { songIdx = (songIdx + 1) % playlist.length; audio.src = playlist[songIdx].url; audio.play(); playBtn.innerText = "⏸"; }
    function prevSong() { songIdx = (songIdx - 1 + playlist.length) % playlist.length; audio.src = playlist[songIdx].url; audio.play(); playBtn.innerText = "⏸"; }

    /* --- STORAGE HELPERS --- */
    function saveFavs() { localStorage.setItem('dreamfolio_favs', JSON.stringify(favourites)); }

    function toggleFav(id, type, event) {
        event.stopPropagation();
        const btn = event.currentTarget;
        const list = favourites[type];
        const index = list.indexOf(id);
        if (index > -1) { list.splice(index, 1); btn.classList.remove('active'); } 
        else { list.push(id); btn.classList.add('active'); }
        saveFavs();
    }

    /* --- NAV LOGIC --- */
    window.onpopstate = function() { showHome(false); };
    function openSection(id) {
        currentMode = id;
        history.pushState({page: id}, id, "");
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('main-nav').classList.add('visible');
        document.getElementById('section-container').classList.add('active');
        if(id === 'watch') setupWatchlist();
        if(id === 'diy') setupDIY();
        window.scrollTo(0,0);
    }
    function showHome(updateHistory = true) {
        document.getElementById('home-page').style.display = 'flex';
        document.getElementById('main-nav').classList.remove('visible');
        document.getElementById('section-container').classList.remove('active');
        if(updateHistory) history.replaceState(null, "", " ");
        window.scrollTo(0,0);
    }

    /* --- DIY LOGIC --- */
    async function setupDIY() {
        const filterContainer = document.getElementById('filter-container');
        const grid = document.getElementById('content-grid');
        grid.innerHTML = '<center>🎀 Loading...</center>';
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;
        try {
            const res = await fetch(url);
            const text = await res.text();
            const json = JSON.parse(text.substr(47).slice(0, -2));
            diyData = json.table.rows.slice(1).map((r, i) => ({
                id: 'diy-' + i,
                title: r.c[0]?.v || "Untitled",
                category: r.c[1]?.v || "Other",
                img: r.c[2]?.v || ""
            }));
            const categories = [...new Set(diyData.map(item => item.category))];
            filterContainer.innerHTML = `<button class="filter-btn active" onclick="filterDIY('All', this)">All</button>` + 
                `<button class="filter-btn" style="color:#ff4d6d" onclick="filterDIY('Favs', this)">❤ Favourites</button>` +
                categories.map((cat) => `<button class="filter-btn" onclick="filterDIY('${cat}', this)">${cat}</button>`).join('');
            filterDIY('All', filterContainer.querySelector('.filter-btn'));
        } catch (e) { grid.innerHTML = "<center>Check Sheet 🎀</center>"; }
    }

    function filterDIY(category, btn) {
        updateFilterUI(btn);
        const grid = document.getElementById('content-grid');
        let filtered = (category === 'All') ? diyData : (category === 'Favs') ? diyData.filter(item => favourites.diy.includes(item.id)) : diyData.filter(item => item.category === category);
        renderGrid(filtered, 'diy');
    }

    /* --- WATCHLIST LOGIC --- */
    function setupWatchlist() {
        const filterContainer = document.getElementById('filter-container');
        const genres = [
            { name: 'All', id: 'popular' },
            { name: '❤ Favourites', id: 'favs' },
            { name: 'Rom-Com', id: '10749' },
            { name: 'Thriller', id: '53' },
            { name: 'Horror', id: '27' },
            { name: 'K-Drama', id: 'kdrama' }
        ];
        filterContainer.innerHTML = genres.map((g, index) => `
            <button class="filter-btn ${index === 0 ? 'active' : ''}" ${g.id === 'favs' ? 'style="color:#ff4d6d"' : ''} onclick="loadMovies('${g.id}', this)">${g.name}</button>
        `).join('');
        loadMovies('popular', filterContainer.querySelector('.filter-btn'));
    }

    async function loadMovies(type, btn) {
        updateFilterUI(btn);
        const grid = document.getElementById('content-grid');
        if (type === 'favs') {
            const favMovies = currentMovies.filter(m => favourites.watch.includes('mov-'+m.id));
            renderGrid(favMovies, 'watch');
            return;
        }
        grid.innerHTML = '<center>✨ Loading...</center>';
        let url = type === 'kdrama' 
            ? `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_origin_country=KR&sort_by=popularity.desc`
            : type === 'popular' 
            ? `https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_KEY}`
            : `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_genres=${type}`;
        const res = await fetch(url);
        const data = await res.json();
        currentMovies = data.results;
        renderGrid(currentMovies, 'watch');
    }

    function renderGrid(items, type) {
        const grid = document.getElementById('content-grid');
        if (items.length === 0) { grid.innerHTML = '<center style="grid-column:1/-1; padding:40px; color:#888;">Kuchh pasand to kar lo pehle.</center>'; return; }
        grid.innerHTML = items.map(item => {
            const id = type === 'diy' ? item.id : 'mov-' + item.id;
            const isFav = favourites[type === 'diy' ? 'diy' : 'watch'].includes(id);
            const imgPath = type === 'diy' ? item.img : `https://image.tmdb.org/t/p/w500${item.poster_path}`;
            const title = type === 'diy' ? item.title : (item.title || item.name);
            return `
                <div class="item-card">
                    <button class="heart-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${id}', '${type === 'diy' ? 'diy' : 'watch'}', event)">❤</button>
                    <div class="img-container"><img src="${imgPath}" loading="lazy"></div>
                    <div class="item-title">${title}</div>
                </div>`;
        }).join('');
    }

    function updateFilterUI(btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    /* --- TEDDY GAME --- */
    let isCatching = false;
    function catchTeddy(e) {
        if (isCatching) return;
        isCatching = true;
        let currentScore = parseInt(localStorage.getItem('teddyScore') || 0) + 1;
        localStorage.setItem('teddyScore', currentScore);
        const peeker = document.getElementById('peeker');
        const x = e.clientX || (e.touches && e.touches[0].clientX);
        const y = e.clientY || (e.touches && e.touches[0].clientY);
        for (let i = 0; i < 6; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.innerHTML = '❤';
            heart.style.left = (x + (Math.random() - 0.5) * 100) + 'px';
            heart.style.top = (y + (Math.random() - 0.5) * 50) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1500);
        }
        peeker.style.opacity = "0";
        setTimeout(() => { peeker.style.display = "none"; peeker.style.opacity = "1"; isCatching = false; }, 400);
    }

    function triggerTeddyPeek() {
        if (isCatching) return;
        const peeker = document.getElementById('peeker');
        peeker.style.display = "block";
        const edges = ['top', 'bottom', 'left', 'right'];
        const edge = edges[Math.floor(Math.random() * edges.length)];
        const pos = Math.floor(Math.random() * 60) + 20;
        peeker.style.top = peeker.style.bottom = peeker.style.left = peeker.style.right = "auto";
        if (edge === 'bottom') { peeker.style.bottom = "0"; peeker.style.left = pos + "%"; peeker.style.animation = "peek-bottom 3s ease-in-out forwards"; }
        else if (edge === 'top') { peeker.style.top = "0"; peeker.style.left = pos + "%"; peeker.style.animation = "peek-top 3s ease-in-out forwards"; }
        else if (edge === 'left') { peeker.style.left = "0"; peeker.style.top = pos + "%"; peeker.style.animation = "peek-left 3s ease-in-out forwards"; }
        else { peeker.style.right = "0"; peeker.style.top = pos + "%"; peeker.style.animation = "peek-right 3s ease-in-out forwards"; }
        setTimeout(() => { if (!isCatching) peeker.style.display = "none"; }, 3100);
    }
    setInterval(triggerTeddyPeek, 25000);

    /* --- POOKIE REMINDERS --- */
    const myNotes = ["Standard reminder that I’m definitely the favourite cousin.", "You’re doing great, even on the days you feel like a potato.", "Keep being a menace to society. It suits you.", "If you ever need to hide a body, I'm the one you call.", "Your sketchbook is cooler than most people’s entire personalities.", "Your art is so good it makes me want to go buy supplies I’ll never use.", "I’m 100% convinced you don’t know what 'bad art' actually looks like.", "If we were in a horror movie, you’d definitely be the one to survive."];
    function openNote() {
        const overlay = document.getElementById('note-overlay');
        document.getElementById('note-content').innerText = myNotes[Math.floor(Math.random() * myNotes.length)];
        document.getElementById('score-display').innerText = `Teddies Caught: ${localStorage.getItem('teddyScore') || 0}`;
        overlay.style.display = 'flex';
    }
    function closeNote() { document.getElementById('note-overlay').style.display = 'none'; }
</script>
