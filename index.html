<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamfolio 🎀</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pink-soft: #ffdde1;
            --accent: #ff85a1;
            --shadow: rgba(255, 133, 161, 0.15);
            --transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--pink-soft); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; border: 2px solid var(--pink-soft); }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
        
        body { 
            background-color: var(--pink-soft); 
            background-image: radial-gradient(#fff 2px, transparent 2px); 
            background-size: 30px 30px; 
            min-height: 100vh; 
            padding-top: 80px;
        }

        /* Sticky Header */
        .navbar {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 70px;
            background: white;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; box-shadow: 0 4px 15px var(--shadow);
            z-index: 2000;
        }

        .nav-logo {
            font-family: 'Cherry Bomb One', cursive;
            font-size: 1.8rem; color: var(--accent); font-weight: 400; cursor: pointer;
        }

        .nav-links { display: flex; gap: 20px; }
        .nav-item { font-weight: 600; color: #888; cursor: pointer; font-size: 0.9rem; }
        .nav-item:hover { color: var(--accent); }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* Sticky Filter Bar */
        .sticky-filters {
            position: sticky;
            top: 70px;
            background: var(--pink-soft);
            padding: 15px 0;
            z-index: 1000;
            margin-bottom: 20px;
        }

        #home-page { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; margin-top: 40px;
        }

        .icon-card { 
            background: white; border-radius: 40px; padding: 50px 20px; 
            text-align: center; cursor: pointer; border: 8px solid white; 
            box-shadow: 0 15px 30px var(--shadow); transition: var(--transition); 
        }
        .icon-card:hover { transform: translateY(-8px); }
        .icon-emoji { font-size: 4.5rem; display: block; margin-bottom: 15px; }
        .icon-label { font-size: 1.8rem; color: var(--accent); font-family: 'Cherry Bomb One', cursive; font-weight: 400; }

        .section { display: none; animation: fadeIn 0.5s ease forwards; }
        .section.active { display: block; }
        
        .filters { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .filter-btn { 
            background: white; border: none; padding: 10px 22px; 
            border-radius: 50px; cursor: pointer; color: var(--accent); 
            font-weight: 400; box-shadow: 0 4px 8px var(--shadow);
        }
        .filter-btn.active { background: var(--accent); color: white; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        
        .item-card { 
            background: white; border-radius: 25px; padding: 15px; 
            border: 4px solid white; box-shadow: 0 8px 15px var(--shadow); text-align: center;
        }

        .img-container { 
            width: 100%; aspect-ratio: 2/3; border-radius: 15px; 
            overflow: hidden; margin-bottom: 12px; background: #fff0f3; 
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .item-title { font-weight: 600; color: #444; font-size: 1rem; margin-bottom: 8px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-logo" onclick="showHome()">Dreamfolio</div>
    <div class="nav-links">
        <div class="nav-item" onclick="openSection('watch')">Watchlist</div>
        <div class="nav-item" onclick="openSection('diy')">DIY</div>
    </div>
</nav>

<div class="container">
    <main id="home-page">
        <div class="icon-card" onclick="openSection('watch')">
            <span class="icon-emoji">🍿</span>
            <span class="icon-label">Watchlist</span>
        </div>
        <div class="icon-card" onclick="openSection('diy')">
            <span class="icon-emoji">🎀</span>
            <span class="icon-label">DIY Ideas</span>
        </div>
    </main>

    <!-- Unified Section Structure -->
    <section id="dynamic-section" class="section">
        <div class="sticky-filters">
            <div id="filter-container" class="filters"></div>
        </div>
        <div class="grid" id="content-grid"></div>
    </section>
</div>

<script>
    const TMDB_KEY = 'e3c3686e5a9306f584a69824326db981';
    const SHEET_ID = '1f_PUv6_kAfHFaCMuEcki4tQwRYwmFLjqr-UQk_Ov9FA';
    let diyData = []; // Store sheet data globally to filter without re-fetching

    window.onpopstate = function() { showHome(false); };

    function openSection(id) {
        history.pushState({page: id}, id, "");
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('dynamic-section').classList.add('active');
        
        if(id === 'watch') setupWatchlist();
        if(id === 'diy') setupDIY();
        window.scrollTo(0,0);
    }

    function showHome(updateHistory = true) {
        document.getElementById('home-page').style.display = 'grid';
        document.getElementById('dynamic-section').classList.remove('active');
        if(updateHistory) history.replaceState(null, "", " ");
        window.scrollTo(0,0);
    }

    // --- DIY LOGIC ---
    async function setupDIY() {
        const filterContainer = document.getElementById('filter-container');
        const grid = document.getElementById('content-grid');
        grid.innerHTML = '<center>🎀 Gathering your ideas...</center>';
        
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;
        
        try {
            const res = await fetch(url);
            const text = await res.text();
            const json = JSON.parse(text.substr(47).slice(0, -2));
            diyData = json.table.rows.slice(1).map(r => ({
                title: r.c[0]?.v || "Untitled",
                category: r.c[1]?.v || "Other",
                img: r.c[2]?.v || ""
            }));

            // Create unique filters based on your "Category" column
            const categories = [...new Set(diyData.map(item => item.category))];
            
            filterContainer.innerHTML = categories.map((cat, index) => `
                <button class="filter-btn ${index === 0 ? 'active' : ''}" 
                        onclick="filterDIY('${cat}', this)">${cat}</button>
            `).join('');

            filterDIY(categories[0], filterContainer.querySelector('.filter-btn'));
        } catch (e) { grid.innerHTML = "<center>Check Sheet 🎀</center>"; }
    }

    function filterDIY(category, btn) {
        updateFilterUI(btn);
        const grid = document.getElementById('content-grid');
        const filtered = diyData.filter(item => item.category === category);
        
        grid.innerHTML = filtered.map(item => `
            <div class="item-card">
                <div class="img-container"><img src="${item.img}" loading="lazy"></div>
                <div class="item-title">${item.title}</div>
            </div>
        `).join('');
    }

    // --- WATCHLIST LOGIC ---
    function setupWatchlist() {
        const filterContainer = document.getElementById('filter-container');
        const genres = [
            { name: 'Trending', id: 'popular' },
            { name: 'Rom-Com', id: '10749' },
            { name: 'Thriller', id: '53' },
            { name: 'Horror', id: '27' },
            { name: 'K-Drama', id: 'kdrama' }
        ];

        filterContainer.innerHTML = genres.map((g, index) => `
            <button class="filter-btn ${index === 0 ? 'active' : ''}" 
                    onclick="loadMovies('${g.id}', this)">${g.name}</button>
        `).join('');

        loadMovies('popular', filterContainer.querySelector('.filter-btn'));
    }

    async function loadMovies(type, btn) {
        updateFilterUI(btn);
        const grid = document.getElementById('content-grid');
        grid.innerHTML = '<center>✨ Curating...</center>';
        
        let url = type === 'kdrama' 
            ? `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_origin_country=KR&sort_by=popularity.desc`
            : type === 'popular' 
            ? `https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_KEY}`
            : `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_genres=${type}`;

        const res = await fetch(url);
        const data = await res.json();
        grid.innerHTML = data.results.map(m => `
            <div class="item-card">
                <div class="img-container">
                    <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" loading="lazy">
                </div>
                <div class="item-title">${m.title || m.name}</div>
            </div>
        `).join('');
    }

    function updateFilterUI(btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add( 'active');
    }
</script>
</body>
</html>
